            </tr>
            <tr>
              <td colSpan={7}><span className="eyebrow">+ Reintegros a cada socio</span></td>
              {SOCIOS.map((s) => <td key={s.key} className="num r" style={{ color: r.total.reintegro[s.key] ? "var(--good)" : "var(--faint)" }}>{r.total.reintegro[s.key] ? `+ ${money(r.total.reintegro[s.key])}` : "—"}</td>)}
            </tr>
            <tr>
              <td colSpan={7}><span className="eyebrow" style={{ color: "var(--fg)" }}>Total por socio</span></td>
              {SOCIOS.map((s) => <td key={s.key} className="num r" style={{ color: s.color }}>{money(r.total.socio[s.key])}</td>)}
            </tr>
          </tfoot>
        </Tabla>
        <div className="p-4" style={{ borderTop: "1px solid var(--line-soft)" }}>
          {r.diferencias.length === 0 ? (
            <div className="aviso aviso-good" role="status"><Icon name="Check" size={14} />Coincide con la liquidación del mes (según participación): ganancia neta + reintegros de cada socio.</div>
          ) : (
            <div className="aviso aviso-bad" role="status">
              <Icon name="AlertTriangle" size={14} />
              <div>
                No coincide con la liquidación del mes (según participación):{" "}
                {r.diferencias.map((s, i) => <span key={s.key}>{i ? " · " : ""}{s.name} {money(r.total.socio[s.key])} acá, {money(f.liqProp[s.key])} en la liquidación</span>)}.
                {(sinElegir || falta) && <> Hay {money(sinElegir ? r.totalComunes : r.faltante)} de gastos sin cubrir.</>}
                {nombresSinCien.length > 0 && <> Reparto ≠ 100% en {nombresSinCien.join(", ")}.</>}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- Gráficos ---------- */
const compacto = new Intl.NumberFormat("es-AR", { notation: "compact", maximumFractionDigits: 1 });
const moneyCorto = (n) => `${n < 0 ? "−" : ""}$${compacto.format(Math.abs(n))}`;
const fmtMomento = (ms) => new Date(ms).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const signo = (n) => ({ color: n < 0 ? "var(--bad)" : undefined });

function escalaLinda(min, max, n = 4) {
  if (min === max) max = min + 1;
  const paso0 = (max - min) / n;
  const mag = 10 ** Math.floor(Math.log10(paso0));
  const paso = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((p) => p >= paso0);
  const lo = Math.floor(min / paso) * paso;
  const hi = Math.ceil(max / paso) * paso;
  const ticks = [];
  for (let v = lo; v <= hi + paso / 2; v += paso) ticks.push(Math.round(v));
  return { lo, hi, ticks };
}

function useAncho() {
  const ref = useRef(null);
  const [ancho, setAncho] = useState(720);
  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setAncho(Math.max(300, Math.round(e.contentRect.width))));
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, ancho];
}

// Etiqueta de mes en el eje: "nov", y el año en el primer mes y en enero.
const etiquetaMes = (ym, i) => { const [y, m] = ym.split("-"); return i === 0 || m === "01" ? `${MESES[+m - 1]} ${y.slice(2)}` : MESES[+m - 1]; };

function Leyenda({ series, linea }) {
  return (
    <div className="leyenda">
      {series.map((s) => <span key={s.key}><span className={linea ? "ley-linea" : "ley-rect"} style={{ background: s.color }} />{s.label}</span>)}
    </div>
  );
}

function TipGrafico({ x, ancho, titulo, filas }) {
  return (
    <div className="chart-tip" style={{ left: Math.min(Math.max(x, 110), ancho - 110) }}>
      <div className="eyebrow mb-1" style={{ textTransform: "none", letterSpacing: 0 }}>{titulo}</div>
      {filas.map((f) => (
        <div key={f.label} className="fila">
          <span className="flex items-center gap-2">{f.color ? <span className="key" style={{ background: f.color }} /> : <span style={{ width: 10 }} />}<strong className="num">{money(f.valor)}</strong></span>
          <span style={{ color: "var(--muted)" }}>{f.label}</span>
        </div>
      ))}
    </div>
  );
}

// Cada mes es una banda con su zona de clic/hover/foco (más grande que las marcas).
function ZonaMes({ x, y, w, h, fila, i, setActiva, onMes, etiqueta }) {
  return (
    <rect className="bar-hit" x={x} y={y} width={w} height={h} tabIndex={0} role="button" aria-label={etiqueta}
      onPointerEnter={() => setActiva(i)} onPointerLeave={() => setActiva(null)} onFocus={() => setActiva(i)} onBlur={() => setActiva(null)}
      onClick={() => onMes(fila.mes)} onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onMes(fila.mes); } }} />
  );
}

const SERIES_BARRAS = [
  { key: "fact", label: "Facturación", color: "var(--chart)" },
  { key: "gastos", label: "Gastos", color: "var(--chart-2)" },
];

// Barras agrupadas por mes: Facturación vs Gastos, un solo eje, 2px de aire entre barras vecinas.
function BarrasMes({ filas, onMes }) {
  const [ref, ancho] = useAncho();
  const [activa, setActiva] = useState(null);
  const alto = 240, m = { t: 12, r: 8, b: 28, l: 64 };
  const w = ancho - m.l - m.r, h = alto - m.t - m.b;
  const { lo, hi, ticks } = escalaLinda(0, Math.max(0, ...filas.flatMap((f) => [f.fact, f.gastos])));
  const y = (v) => m.t + ((hi - v) / (hi - lo)) * h;
  const banda = w / Math.max(filas.length, 1);
  const barra = Math.max(4, Math.min(24, (banda * 0.7 - 2) / 2));
  const inicio = (i) => m.l + banda * i + banda / 2 - barra - 1;
  const columna = (x, v) => {
    if (!(v > 0)) return null;
    const y0 = y(0), yv = y(v), r = Math.min(4, y0 - yv, barra / 2);
    return `M${x},${y0} V${yv + r} Q${x},${yv} ${x + r},${yv} H${x + barra - r} Q${x + barra},${yv} ${x + barra},${yv + r} V${y0} Z`;
  };
  const f = activa !== null ? filas[activa] : null;
  return (
    <div className="chart" ref={ref}>
      <Leyenda series={SERIES_BARRAS} />
      <svg width={ancho} height={alto} role="img" aria-label="Facturación y gastos por mes. Los valores están en la tabla de abajo.">
        {ticks.map((t) => (
          <g key={t}>
            <line x1={m.l} x2={ancho - m.r} y1={y(t)} y2={y(t)} stroke={t === 0 ? "var(--faint)" : "var(--line-soft)"} strokeWidth="1" />
            <text className="tick-y" x={m.l - 8} y={y(t) + 4} textAnchor="end">{moneyCorto(t)}</text>
          </g>
        ))}
        {filas.map((fila, i) => (
          <g key={fila.mes} className={`bar-g${activa === i ? " activa" : ""}`}>
            {columna(inicio(i), fila.fact) && <path d={columna(inicio(i), fila.fact)} fill="var(--chart)" />}
            {columna(inicio(i) + barra + 2, fila.gastos) && <path d={columna(inicio(i) + barra + 2, fila.gastos)} fill="var(--chart-2)" />}
            <text x={m.l + banda * i + banda / 2} y={alto - 8} textAnchor="middle">{etiquetaMes(fila.mes, i)}</text>
            <ZonaMes x={m.l + banda * i} y={m.t} w={banda} h={h} fila={fila} i={i} setActiva={setActiva} onMes={onMes}
              etiqueta={`${fmtMesLargo(fila.mes)}: facturación ${money(fila.fact)}, gastos ${money(fila.gastos)}. Ver el mes.`} />
          </g>
        ))}
      </svg>
      {f && <TipGrafico x={m.l + banda * activa + banda / 2} ancho={ancho} titulo={`${fmtMesLargo(f.mes)} · clic para ver el mes`}
        filas={[{ label: "Facturación", valor: f.fact, color: "var(--chart)" }, { label: "Gastos", valor: f.gastos, color: "var(--chart-2)" }, { label: "Margen neto", valor: f.neto }]} />}
    </div>
  );
}

// Líneas de 2px con la ganancia de cada socio (en sus colores), punto de 8px con anillo y mira vertical.
function LineasSocios({ filas, onMes }) {
  const [ref, ancho] = useAncho();
  const [activa, setActiva] = useState(null);
  const alto = 240, m = { t: 16, r: 64, b: 28, l: 64 };
  const w = ancho - m.l - m.r, h = alto - m.t - m.b;
  const valores = filas.flatMap((f) => SOCIOS.map((s) => f.socios[s.key]));
  const { lo, hi, ticks } = escalaLinda(Math.min(0, ...valores), Math.max(0, ...valores));
  const y = (v) => m.t + ((hi - v) / (hi - lo)) * h;
  const banda = w / Math.max(filas.length, 1);
  const x = (i) => m.l + banda * i + banda / 2;
  const ultimo = filas.length - 1;
  // Etiquetas directas al final de cada línea, solo si no se pisan (si no, quedan la leyenda y el tooltip).
  const finales = filas.length ? SOCIOS.map((s) => ({ s, y: y(filas[ultimo].socios[s.key]) })).sort((a, b) => a.y - b.y) : [];
  const etiquetasOk = finales.every((e, i) => i === 0 || e.y - finales[i - 1].y >= 14);
  const f = activa !== null ? filas[activa] : null;
  return (
    <div className="chart" ref={ref}>
      <Leyenda series={SOCIOS.map((s) => ({ key: s.key, label: s.name, color: s.color }))} linea />
      <svg width={ancho} height={alto} role="img" aria-label="Ganancia de cada socio por mes. Los valores están en la tabla de abajo.">
        {ticks.map((t) => (
          <g key={t}>
            <line x1={m.l} x2={ancho - m.r} y1={y(t)} y2={y(t)} stroke={t === 0 ? "var(--faint)" : "var(--line-soft)"} strokeWidth="1" />
            <text className="tick-y" x={m.l - 8} y={y(t) + 4} textAnchor="end">{moneyCorto(t)}</text>
          </g>
        ))}
        {filas.map((fila, i) => <text key={fila.mes} x={x(i)} y={alto - 8} textAnchor="middle">{etiquetaMes(fila.mes, i)}</text>)}
        {activa !== null && <line x1={x(activa)} x2={x(activa)} y1={m.t} y2={m.t + h} stroke="var(--line)" strokeWidth="1" />}
        {SOCIOS.map((s) => (
          <g key={s.key}>
            {filas.length > 1 && <path d={filas.map((fila, i) => `${i ? "L" : "M"}${x(i)},${y(fila.socios[s.key])}`).join(" ")} fill="none" stroke={s.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />}
            {filas.map((fila, i) => <circle key={fila.mes} cx={x(i)} cy={y(fila.socios[s.key])} r={activa === i ? 5 : 4} fill={s.color} stroke="var(--surface)" strokeWidth="2" />)}
          </g>
        ))}
        {etiquetasOk && finales.map(({ s, y: yy }) => <text key={s.key} className="valor" x={x(ultimo) + 10} y={yy + 4}>{s.name}</text>)}
        {filas.map((fila, i) => (
          <ZonaMes key={fila.mes} x={m.l + banda * i} y={m.t} w={banda} h={h} fila={fila} i={i} setActiva={setActiva} onMes={onMes}
            etiqueta={`${fmtMesLargo(fila.mes)}: ${SOCIOS.map((s) => `${s.name} ${money(fila.socios[s.key])}`).join(", ")}. Ver el mes.`} />
        ))}
      </svg>
      {f && <TipGrafico x={x(activa)} ancho={ancho} titulo={`${fmtMesLargo(f.mes)} · clic para ver el mes`} filas={SOCIOS.map((s) => ({ label: s.name, valor: f.socios[s.key], color: s.color }))} />}
    </div>
  );
}

function AnioSelector({ anio, setAnio, min, max }) {
  return (
    <div className="mes-sel" role="group" aria-label="Año">
      <button className="icon-btn" aria-label="Año anterior" disabled={anio <= min} onClick={() => setAnio(anio - 1)}><Icon name="ChevronLeft" size={18} /></button>
      <span className="display mes-nombre" style={{ minWidth: 90 }} aria-live="polite">{anio}</span>
      <button className="icon-btn" aria-label="Año siguiente" disabled={anio >= max} onClick={() => setAnio(anio + 1)}><Icon name="ChevronRight" size={18} /></button>
    </div>
  );
}

/* ---------- Historial ---------- */
// Una fila por mes desde el inicio (nov 2026) hasta el mes actual, con los mismos cálculos del dashboard.
const COLS_HISTORIAL = [160, 130, 130, 120, 120, 130, 130, 130, 90, 130, 120, 120, 120];

function HistorialTab({ data, irAMes }) {
  const actual = mesActual();
  const anioActual = +actual.slice(0, 4);
  const [anio, setAnio] = useState(anioActual);
  const filas = useMemo(() => {
    const out = [];
    for (let mm = mesMax(INICIO, `${anio}-01`); mm <= actual && mm <= `${anio}-12`; mm = sumarMeses(mm, 1)) {
      const f = calcularMes(data, mm);
      out.push({
        mes: mm, fact: f.ingresos, cobrado: f.cobrado, nPagos: f.nPagos, plat: f.porSeccion.plataformas, oper: f.porSeccion.operativos, edit: f.porSeccion.editores,
        gastos: f.gastos, neto: f.neto, socios: Object.fromEntries(SOCIOS.map((s) => [s.key, f.liq[s.key].ganancia])),
      });
    }
    return out;
  }, [data, anio, actual]);
  const campos = ["fact", "cobrado", "nPagos", "plat", "oper", "edit", "gastos", "neto"];
  const tot = Object.fromEntries(campos.map((k) => [k, suma(filas, (x) => x[k])]));
  tot.socios = Object.fromEntries(SOCIOS.map((s) => [s.key, suma(filas, (x) => x.socios[s.key])]));
  const n = filas.length || 1;
  const margen = (neto, fact) => (fact ? `${((neto / fact) * 100).toFixed(1).replace(".", ",")}%` : "—");
  const ticket = (cob, np) => (np ? money(cob / np) : "—");
  const celdas = (x) => [
    <td key="fact" className="num r">{money(x.fact)}</td>,
    <td key="cob" className="num r">{money(x.cobrado)}</td>,
    <td key="plat" className="num r" style={{ color: "var(--muted)" }}>{money(x.plat)}</td>,
    <td key="oper" className="num r" style={{ color: "var(--muted)" }}>{money(x.oper)}</td>,
    <td key="edit" className="num r" style={{ color: "var(--muted)" }}>{money(x.edit)}</td>,
    <td key="gas" className="num r">{money(x.gastos)}</td>,
    <td key="neto" className="num r font-bold" style={signo(x.neto)}>{money(x.neto)}</td>,
    <td key="mg" className="num r">{margen(x.neto, x.fact)}</td>,
    <td key="tk" className="num r">{ticket(x.cobrado, x.nPagos)}</td>,
    ...SOCIOS.map((s) => <td key={s.key} className="num r" style={signo(x.socios[s.key])}>{money(x.socios[s.key])}</td>),
  ];

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <AnioSelector anio={anio} setAnio={setAnio} min={+INICIO.slice(0, 4)} max={anioActual} />
        <p className="text-xs" style={{ color: "var(--muted)" }}>Desde {fmtMesLargo(INICIO)}. Hacé clic en un mes (en los gráficos o en la tabla) para verlo en el dashboard.</p>
      </div>

      <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <StatCard label={`Facturación ${anio}`} value={money(tot.fact)} sub={`${filas.length} mes${filas.length === 1 ? "" : "es"}`} icon="TrendingUp" tone="var(--accent)" />
        <StatCard label={`Cobrado ${anio}`} value={money(tot.cobrado)} sub={tot.fact ? `${((tot.cobrado / tot.fact) * 100).toFixed(0)}% de lo facturado` : "—"} icon="CircleDollarSign" tone="var(--good)" />
        <StatCard label={`Gastos ${anio}`} value={money(tot.gastos)} sub="Plataformas, operativos y equipo" icon="Receipt" />
        <StatCard label="Margen neto" value={money(tot.neto)} sub={`${margen(tot.neto, tot.fact)} de la facturación`} icon="Wallet" tone={tot.neto >= 0 ? "var(--good)" : "var(--bad)"} />
        <StatCard label="Ticket promedio" value={ticket(tot.cobrado, tot.nPagos)} sub={`${tot.nPagos} pago${tot.nPagos === 1 ? "" : "s"} en ${anio}`} icon="Ticket" />
      </section>

      <div className="panel">
        <div className="p-4" style={{ borderBottom: "1px solid var(--line-soft)" }}>
          <h2 className="display text-lg font-bold">Facturación vs gastos · {anio}</h2>
        </div>
        <div className="p-4">{filas.length ? <BarrasMes filas={filas} onMes={irAMes} /> : <p className="text-xs" style={{ color: "var(--faint)" }}>Sin meses en {anio}.</p>}</div>
      </div>
      <div className="panel">
        <div className="p-4" style={{ borderBottom: "1px solid var(--line-soft)" }}>
          <h2 className="display text-lg font-bold">Ganancia de cada socio · {anio}</h2>
          <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>Ganancia neta de la liquidación de cada mes (sin reintegros).</p>
        </div>
        <div className="p-4">{filas.length ? <LineasSocios filas={filas} onMes={irAMes} /> : <p className="text-xs" style={{ color: "var(--faint)" }}>Sin meses en {anio}.</p>}</div>
      </div>

      <div className="panel">
        <div className="p-4" style={{ borderBottom: "1px solid var(--line-soft)" }}>
          <h2 className="display text-lg font-bold">Balance {anio}</h2>
        </div>
        <Tabla cols={COLS_HISTORIAL} fijarPrimera>
          <thead>
            <tr>
              <th>Mes</th><th className="r">Facturación</th><th className="r">Cobrado</th><th className="r">Plataformas</th><th className="r">Operativos</th><th className="r">Editores y CM</th>
              <th className="r">Gastos totales</th><th className="r">Margen neto</th><th className="r">Margen %</th><th className="r">Ticket prom.</th>
              {SOCIOS.map((s) => <th key={s.key} className="r" style={{ color: s.color }}>{s.name}</th>)}
            </tr>
          </thead>
          <tbody>
            {filas.length === 0 && <tr><td colSpan={COLS_HISTORIAL.length} className="text-center py-6" style={{ color: "var(--faint)" }}>Sin meses en {anio}.</td></tr>}
            {filas.map((x) => (
              <tr key={x.mes} className="fila-mes" onClick={() => irAMes(x.mes)}>
                <td><button className="link-mes" onClick={(e) => { e.stopPropagation(); irAMes(x.mes); }}>{fmtMesLargo(x.mes)}</button></td>
                {celdas(x)}
              </tr>
            ))}
          </tbody>
          {filas.length > 0 && (
            <tfoot>
              <tr><td><span className="eyebrow" style={{ color: "var(--fg)" }}>Total {anio}</span></td>{celdas(tot)}</tr>
              <tr>
                <td><span className="eyebrow">Promedio mensual</span></td>
                {celdas({ ...Object.fromEntries(campos.map((k) => [k, tot[k] / n])), socios: Object.fromEntries(SOCIOS.map((s) => [s.key, tot.socios[s.key] / n])) })}
              </tr>
            </tfoot>
          )}
        </Tabla>
      </div>
    </div>
  );
}

/* ---------- Cuentas ---------- */
// Usuario y contraseña de cada red de cada cliente. Van por su propia API (/api/cuentas): las
// contraseñas no viajan con el resto de los datos, se piden al tocar Mostrar o Copiar.
const apiPost = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const ACCION_TEXTO = { ver: "vio", copiar: "copió", cambiar: "cambió", borrar: "borró" };
const OCULTAR_MS = 30000;

function useCuentas() {
  const [cuentas, setCuentas] = useState(null);
  const [error, setError] = useState("");
  const indexar = (lista) => new Map(lista.map((c) => [`${c.cliente}|${c.red}`, c]));
  const cargar = useCallback(async () => {
    try { setCuentas(indexar((await api("/cuentas")).cuentas)); setError(""); }
    catch (e) { if (!(e instanceof SesionVencida)) setError(e.message || "No se pudieron cargar las cuentas."); }
  }, []);
  useEffect(() => {
    cargar();
    const onVisible = () => { if (!document.hidden) cargar(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [cargar]);
  const guardar = async (cambio) => setCuentas(indexar((await apiPost("/cuentas/guardar", cambio)).cuentas));
  const revelar = async (cliente, red, accion) => { const { password } = await apiPost("/cuentas/revelar", { cliente, red, accion }); cargar(); return password; };
  return { cuentas, error, guardar, revelar };
}

function CuentaCard({ cliente, red, cuenta, elegida, guardar, revelar }) {
  const [usuario, setUsuario] = useState(cuenta?.usuario || "");
  const [nota, setNota] = useState(cuenta?.nota || "");
  const [visible, setVisible] = useState(null);
  const [editando, setEditando] = useState(false);
  const [nueva, setNueva] = useState("");
  const [confirmBorrar, setConfirmBorrar] = useState(false);
  const [aviso, setAviso] = useState("");
  const foco = useRef(null);
  const tAviso = useRef(null), tOcultar = useRef(null);
  useEffect(() => { if (foco.current !== "usuario") setUsuario(cuenta?.usuario || ""); }, [cuenta?.usuario]);
  useEffect(() => { if (foco.current !== "nota") setNota(cuenta?.nota || ""); }, [cuenta?.nota]);
  useEffect(() => () => { clearTimeout(tAviso.current); clearTimeout(tOcultar.current); }, []);

  const avisar = (msg) => { setAviso(msg); clearTimeout(tAviso.current); tAviso.current = setTimeout(() => setAviso(""), 2500); };
  const base = { cliente: cliente.id, red: red.key };
  const intentar = async (fn, ok) => { try { await fn(); if (ok) avisar(ok); } catch (e) { if (!(e instanceof SesionVencida)) avisar(e.message || "No se pudo guardar"); } };
  const guardarCampo = (campo, valor) => { foco.current = null; if ((cuenta?.[campo] || "") !== valor) intentar(() => guardar({ ...base, [campo]: valor }), "Guardado"); };
  const mostrar = () => {
    if (visible !== null) { setVisible(null); return; }
    intentar(async () => {
      setVisible(await revelar(cliente.id, red.key, "ver"));
      clearTimeout(tOcultar.current);
      tOcultar.current = setTimeout(() => setVisible(null), OCULTAR_MS);
    });
  };
  const copiar = () => intentar(async () => navigator.clipboard.writeText(await revelar(cliente.id, red.key, "copiar")), "Copiada");
  const guardarPassword = (password) => intentar(async () => {
    await guardar({ ...base, password });
    setNueva(""); setEditando(false); setVisible(null); setConfirmBorrar(false);
  }, password ? "Contraseña guardada" : "Contraseña borrada");
  const pidePassword = editando || !cuenta?.tienePassword;

  return (
    <div className="cuenta">
      <div className="flex items-center justify-between gap-2">
        <span className="font-semibold flex items-center gap-2">{red.label}{!elegida && <span className="chip chip-muted">No elegida</span>}</span>
        {aviso && <span className="text-xs" role="status" style={{ color: "var(--muted)" }}>{aviso}</span>}
      </div>
      <label className="campo"><span>Usuario</span>
        <Celda value={usuario} placeholder="Usuario o mail" autoComplete="off" spellCheck={false} onFocus={() => { foco.current = "usuario"; }} onChange={(e) => setUsuario(e.target.value)} onBlur={() => guardarCampo("usuario", usuario)} />
      </label>
      <div className="campo"><span>Contraseña</span>
        {pidePassword ? (
          <div className="flex items-center gap-1 min-w-0">
            <input className="cell" type="password" autoComplete="new-password" data-lpignore="true" value={nueva} placeholder={cuenta?.tienePassword ? "Nueva contraseña" : "Cargar contraseña"} aria-label={`Contraseña de ${red.label} de ${cliente.cliente}`}
              onChange={(e) => setNueva(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && nueva) guardarPassword(nueva); }} />
            <button className="btn" style={{ padding: "6px 10px" }} disabled={!nueva} onClick={() => guardarPassword(nueva)}>Guardar</button>
            {editando && <button className="icon-btn" aria-label="Cancelar" onClick={() => { setEditando(false); setNueva(""); setConfirmBorrar(false); }}><Icon name="X" size={14} /></button>}
          </div>
        ) : (
          <div className="flex items-center gap-1 min-w-0">
            <span className="secreto trunc px-2" style={{ flex: 1 }} title={visible ?? undefined}>{visible ?? "••••••••••"}</span>
            <button className="icon-btn" aria-label={visible !== null ? "Ocultar contraseña" : "Mostrar contraseña"} title={visible !== null ? "Ocultar" : "Mostrar (se oculta sola a los 30 s)"} onClick={mostrar}><Icon name={visible !== null ? "EyeOff" : "Eye"} size={15} /></button>
            <button className="icon-btn" aria-label="Copiar contraseña" title="Copiar" onClick={copiar}><Icon name="Copy" size={15} /></button>
            <button className="icon-btn" aria-label="Cambiar contraseña" title="Cambiar" onClick={() => { setEditando(true); setVisible(null); }}><Icon name="Pencil" size={15} /></button>
          </div>
        )}
      </div>
      {editando && cuenta?.tienePassword && (
        <div className="flex justify-end">
          {confirmBorrar
            ? <button className="chip chip-bad" style={{ border: "none", cursor: "pointer" }} onClick={() => guardarPassword("")}>Sí, borrar la contraseña</button>
            : <button className="chip chip-action" onClick={() => setConfirmBorrar(true)}>Borrar contraseña</button>}
        </div>
      )}
      <label className="campo"><span>Nota</span>
        <Celda value={nota} placeholder="2FA, mail de recuperación…" onFocus={() => { foco.current = "nota"; }} onChange={(e) => setNota(e.target.value)} onBlur={() => guardarCampo("nota", nota)} />
      </label>
      {(cuenta?.actualizado || cuenta?.ultimoAcceso) && (
        <div className="text-xs flex flex-col gap-0.5" style={{ color: "var(--faint)" }}>
          {cuenta.actualizado && <span>Modificada por {USUARIOS[cuenta.actualizado.por] || cuenta.actualizado.por} · {fmtMomento(cuenta.actualizado.at)}</span>}
          {cuenta.ultimoAcceso && <span>Último acceso: {USUARIOS[cuenta.ultimoAcceso.por] || cuenta.ultimoAcceso.por} la {ACCION_TEXTO[cuenta.ultimoAcceso.accion] || cuenta.ultimoAcceso.accion} · {fmtMomento(cuenta.ultimoAcceso.at)}</span>}
        </div>
      )}
    </div>
  );
}
const USUARIOS = Object.fromEntries(SOCIOS.map((s) => [s.key, s.name]));

function CuentasTab({ data, setData }) {
  const { cuentas, error, guardar, revelar } = useCuentas();
  const [abiertos, setAbiertos] = useState(() => new Set());
  const [buscar, setBuscar] = useState("");
  const alternar = (id) => setAbiertos((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const updCliente = (id, field, val) => setData((d) => ({ ...d, clients: d.clients.map((c) => (c.id === id ? { ...c, [field]: val } : c)) }));
  const clientes = data.clients.filter((c) => !buscar || String(c.cliente).toLowerCase().includes(buscar.toLowerCase()));

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <p className="text-xs" style={{ color: "var(--muted)", maxWidth: 640 }}>
          Las contraseñas se guardan cifradas y solo se muestran al tocar Mostrar o Copiar. Queda registrado quién las vio, copió o cambió.
        </p>
        <input className="cell" style={{ maxWidth: 240, borderColor: "var(--line)" }} type="search" placeholder="Buscar cliente" value={buscar} onChange={(e) => setBuscar(e.target.value)} aria-label="Buscar cliente" />
      </div>
      {error && <div className="panel p-4 flex items-center gap-2" role="alert" style={{ color: "var(--bad)" }}><Icon name="AlertTriangle" size={14} />{error}</div>}
      <div className="panel">
        {clientes.length === 0 && <p className="p-6 text-center" style={{ color: "var(--faint)" }}>No hay clientes{buscar ? " con ese nombre" : ""}.</p>}
        {clientes.map((c, i) => {
          const elegidas = REDES.filter((r) => c[r.key]);
          const extras = REDES.filter((r) => !c[r.key] && cuentas?.has(`${c.id}|${r.key}`));
          const conPassword = elegidas.filter((r) => cuentas?.get(`${c.id}|${r.key}`)?.tienePassword).length;
          const abierto = abiertos.has(c.id);
          return (
            <div key={c.id} style={{ borderTop: i ? "1px solid var(--line-soft)" : undefined }}>
              <button className="acc-head" aria-expanded={abierto} aria-controls={`cuentas-${c.id}`} onClick={() => alternar(c.id)}>
                <Icon name="ChevronRight" size={16} className="acc-chev" />
                <span className="font-semibold trunc" style={{ flex: 1 }}>{c.cliente}</span>
                <span className="hidden sm:flex gap-1">
                  {elegidas.map((r) => <span key={r.key} className="red-chip on" style={{ cursor: "inherit" }} title={r.label}>{r.corto}</span>)}
                </span>
                <span className="chip chip-muted num">{elegidas.length ? `${conPassword}/${elegidas.length}` : "Sin redes"}</span>
              </button>
              {abierto && (
                <div id={`cuentas-${c.id}`} className="px-4 pb-4 flex flex-col gap-3">
                  <div className="flex flex-wrap items-center gap-2 text-xs" style={{ color: "var(--muted)" }}>
                    Redes que manejamos: <RedesToggle cliente={c} onToggle={(red, v) => updCliente(c.id, red, v)} />
                  </div>
                  {elegidas.length + extras.length === 0 ? (
                    <p className="text-xs" style={{ color: "var(--faint)" }}>Elegí arriba qué redes manejamos con este cliente.</p>
                  ) : !cuentas ? (
                    <p className="text-xs flex items-center gap-2" style={{ color: "var(--muted)" }}><Icon name="Loader2" size={14} className="spin" />Cargando cuentas…</p>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {[...elegidas, ...extras].map((r) => (
                        <CuentaCard key={r.key} cliente={c} red={r} elegida={!!c[r.key]} cuenta={cuentas.get(`${c.id}|${r.key}`)} guardar={guardar} revelar={revelar} />
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Sesión y guardado ---------- */
function EstadoGuardado({ status }) {
  if (status === "saving") return <span className="chip chip-muted" role="status"><Icon name="Loader2" size={12} className="spin" />Guardando…</span>;
  if (status === "saved") return <span className="chip chip-good" role="status"><Icon name="Check" size={12} />Guardado</span>;
  if (status === "error") return <span className="chip chip-bad" role="status"><Icon name="CloudOff" size={12} />Sin conexión · reintentando</span>;
  return null;
}

function CerrarSesion({ user, flush }) {
  const form = useRef(null);
  const [saliendo, setSaliendo] = useState(false);
  const salir = async (e) => {
    e.preventDefault();
    setSaliendo(true);
    try { await flush(); } finally { form.current.submit(); }
  };
  return (
    <form ref={form} method="post" action="/hueveados/logout" onSubmit={salir} className="flex items-center gap-2">
      {user && <span className="hd-user hidden sm:inline">{user}</span>}
      <button className="btn" type="submit" disabled={saliendo} aria-label="Cerrar sesión"><Icon name="LogOut" size={14} /><span className="hidden sm:inline">Cerrar sesión</span></button>
    </form>
  );
}

// Mismo interruptor que la web: guarda la elección en "eggeo-theme", compartida con eggeo.com.ar.
function TemaToggle() {
  const [tema, setTema] = useState(() => document.documentElement.getAttribute("data-theme") || "light");
  const cambiar = () => {
    const t = tema === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("eggeo-theme", t); } catch {}
    setTema(t);
  };
  const etiqueta = tema === "dark" ? "Usar tema claro" : "Usar tema oscuro";
  return <button type="button" className="btn-icon" onClick={cambiar} aria-label={etiqueta} title={etiqueta}><Icon name={tema === "dark" ? "Sun" : "Moon"} size={16} /></button>;
}

// Estado de guardado, tema y sesión van en la barra amarilla (fuera de React en el HTML).
function AccionesHeader({ status, user, flush }) {
  const destino = document.getElementById("hd-actions");
  if (!destino) return null;
  return ReactDOM.createPortal(<><EstadoGuardado status={status} /><TemaToggle /><CerrarSesion user={user} flush={flush} /></>, destino);
}

/* ---------- App ---------- */
function App() {
  const { data: cargado, setData, status, user, loadError, reload, flush } = useDatosCompartidos();
  const data = cargado || VACIO;
  const tabs = [
    { id: "clientes", label: "Clientes", icon: "Users" },
    { id: "gastos", label: "Gastos", icon: "Receipt" },
    { id: "pagos", label: "Pagos", icon: "CircleDollarSign" },
    { id: "liquidacion", label: "Liquidación", icon: "PieChart" },
    { id: "historial", label: "Historial", icon: "History" },
    { id: "cuentas", label: "Cuentas", icon: "KeyRound" },
  ];
  const [tab, setTabState] = useState(() => { const h = location.hash.slice(1); return tabs.some((t) => t.id === h) ? h : "clientes"; });
  const setTab = (id) => { setTabState(id); history.replaceState(null, "", `#${id}`); };
  const [mes, setMes] = useState(mesActual);
  const f = useFinanzas(data, mes);
  const irAMes = (m) => { setMes(m); setTab("liquidacion"); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const pctIssues = data.clients.filter((c) => (+c.manu || 0) + (+c.elias || 0) + (+c.nico || 0) !== 100).length;

  return (
    <div className="wrap flex flex-col gap-5">
      <AccionesHeader status={status} user={user} flush={flush} />
      <header className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <div className="kicker mb-3">Liquidación mensual · {fmtMonth(mes)}</div>
          <h1 className="page-h">Finanzas de la agencia</h1>
        </div>
        {pctIssues > 0 && <span className="chip chip-bad"><Icon name="AlertTriangle" size={12} />{pctIssues} cliente{pctIssues > 1 ? "s" : ""} con reparto ≠ 100%</span>}
      </header>

      {!cargado ? (
        <div className="panel p-6 flex items-center gap-3" style={{ color: "var(--muted)" }}>
          {loadError ? (
            <>No se pudieron cargar los datos.<button className="btn" onClick={reload}><Icon name="RotateCcw" size={14} />Reintentar</button></>
          ) : (
            <><Icon name="Loader2" className="spin" />Cargando datos…</>
          )}
        </div>
      ) : (
        <>
          <div className="flex flex-wrap items-center gap-3">
            <MesSelector mes={mes} setMes={setMes} />
            {mes !== mesActual() && <button className="btn" onClick={() => setMes(mesActual())}><Icon name="CalendarCheck" size={14} />Volver a {fmtMesLargo(mesActual())}</button>}
          </div>

          <section className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <StatCard label="Facturación total" value={money(f.ingresos)} sub={`${f.filas.length} cliente${f.filas.length === 1 ? "" : "s"} con cobro en ${fmtMonth(mes)}`} icon="TrendingUp" tone="var(--accent)" />
            <StatCard label="Gastos totales" value={money(f.gastos)} sub={`${f.gastosMes.length} concepto${f.gastosMes.length === 1 ? "" : "s"} en ${fmtMonth(mes)}`} icon="Receipt" />
            <StatCard label="Margen neto" value={money(f.neto)} sub={`${(f.margen * 100).toFixed(1)}% de la facturación`} icon="Wallet" tone={f.neto >= 0 ? "var(--good)" : "var(--bad)"} />
          </section>
          <section className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            {SOCIOS.map((s) => <PartnerCard key={s.key} socio={s} l={f.liq[s.key]} ingresos={f.ingresos} />)}
          </section>

          <nav className="flex gap-1 overflow-x-auto" role="tablist">
            {tabs.map((t) => (
              <button key={t.id} role="tab" className="tab" aria-selected={tab === t.id} onClick={(e) => { setTab(t.id); e.currentTarget.scrollIntoView({ block: "nearest", inline: "nearest" }); }}>
                <Icon name={t.icon} />{t.label}
              </button>
            ))}
          </nav>

          {tab === "clientes" && <ClientsTab data={data} setData={setData} mes={mes} />}
          {tab === "gastos" && <ExpensesTab data={data} setData={setData} f={f} mes={mes} />}
          {tab === "pagos" && <PagosTab data={data} setData={setData} mes={mes} user={user} f={f} />}
          {tab === "liquidacion" && <SettlementTab data={data} setData={setData} f={f} mes={mes} />}
          {tab === "historial" && <HistorialTab data={data} irAMes={irAMes} />}
          {tab === "cuentas" && <CuentasTab data={data} setData={setData} />}

          <p className="text-xs" style={{ color: "var(--faint)" }}>Los cambios se guardan solos y los ven Manu, Elias y Nico.</p>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
