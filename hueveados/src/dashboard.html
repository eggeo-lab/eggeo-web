<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Finanzas · EGGEO</title>
<!--THEME-->
<style>
/* Estética de la web de EGGEO: Plus Jakarta Sans, beige + amarillo + azul de marca, pastillas y bordes
   redondeados. Los tokens (colores claro/oscuro, fuente) vienen de src/theme.js. */
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* Header: la barra amarilla de la web (azul en oscuro) */
.hd{position:sticky;top:0;z-index:20;background:var(--hd-bg);color:var(--hd-fg);padding-top:env(safe-area-inset-top,0px)}
.hd-bar{max-width:1240px;margin:0 auto;min-height:68px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.logo-link{display:flex;align-items:center;color:var(--hd-fg)}
.hd-logo{height:32px;width:auto;display:block}
.hd-logo-checker{transition:transform .6s var(--ease)}
.logo-link:hover .hd-logo-checker,.logo-link:focus-visible .hd-logo-checker{transform:translateX(38px)}
.hd-tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hd-user{font-size:13px;font-weight:800}
.hd .btn{border-color:color-mix(in srgb,var(--hd-fg) 30%,transparent);color:var(--hd-fg);background:transparent}
.hd .btn:hover{border-color:var(--hd-fg)}
.hd .chip-good{background:color-mix(in srgb,var(--hd-fg) 10%,transparent);color:var(--hd-fg)}
.hd .chip-muted{background:color-mix(in srgb,var(--hd-fg) 10%,transparent);color:var(--hd-fg)}
.btn-icon{width:38px;height:38px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--hd-fg) 28%,transparent);display:grid;place-items:center;color:var(--hd-fg);background:transparent;cursor:pointer;transition:transform .3s var(--ease),background .3s,border-color .3s}
.btn-icon:hover{transform:rotate(15deg);background:color-mix(in srgb,var(--hd-fg) 10%,transparent);border-color:transparent}
.hd :focus-visible{outline:2px solid var(--hd-fg);outline-offset:2px}

/* Página */
.wrap{max-width:1240px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.page-h{margin:0;font-size:clamp(34px,4.6vw,56px);font-weight:800;letter-spacing:-.045em;line-height:.98;text-wrap:balance}
.display{font-family:var(--font);font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.big-num{font-weight:800;letter-spacing:-.03em}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:24px}
.scroll-x{overflow-x:auto}

/* Tablas: "tbl" y no "grid", que en Tailwind es display:grid y desarma la tabla. Anchos por <colgroup>. */
table.tbl{border-collapse:separate;border-spacing:0;table-layout:fixed}
table.tbl th{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;background:var(--surface);position:sticky;top:0}
table.tbl td{padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tbl tbody tr:hover td{background:var(--hover)}
/* Primera columna fija (nombre del cliente): fondo opaco para tapar lo que pasa por debajo */
table.tbl.fija-1 thead th:first-child,table.tbl.fija-1 tbody td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);transition:box-shadow .2s}
table.tbl.fija-1 thead th:first-child{z-index:2}
table.tbl.fija-1 tbody tr:hover td:first-child{background:linear-gradient(var(--hover),var(--hover)),var(--surface)}
.desplazada table.tbl.fija-1 thead th:first-child,.desplazada table.tbl.fija-1 tbody td:first-child{box-shadow:inset -1px 0 0 var(--line-soft),8px 0 12px -8px rgba(0,0,0,.22)}
table.tbl tfoot td{padding:14px 10px;border-top:1px solid var(--line);border-bottom:none;font-weight:800}
table.tbl .r{text-align:right}
table.tbl .c{text-align:center}
table.tbl tr.fuera td{opacity:.5}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Campos: como los de la web pero sin borde dentro de las tablas hasta que se los toca */
.cell{width:100%;min-width:0;box-sizing:border-box;text-overflow:ellipsis;background:transparent;border:1.5px solid transparent;border-radius:12px;padding:7px 10px;color:var(--fg);font:inherit;outline:none;transition:border-color .2s,background .2s}
.cell:hover{border-color:var(--line-soft)}
.cell:focus{border-color:var(--accent);background:var(--surface)}
.cell::placeholder{color:var(--faint)}
.cell.num{text-align:right}
select.cell{appearance:none;cursor:pointer}
select.cell option{background:var(--surface);color:var(--fg)}
input[type=month].cell,input[type=date].cell{font-size:13px;padding:7px 4px 7px 10px}
input[type=month].cell::-webkit-calendar-picker-indicator,input[type=date].cell::-webkit-calendar-picker-indicator{opacity:.55;margin-left:2px;cursor:pointer}
[data-theme="dark"] .cell::-webkit-calendar-picker-indicator{filter:invert(.85)}
.cell.invalido{border-color:var(--bad)}
.pct{width:56px;text-align:center;padding:7px 4px}

/* Botones: pastillas como en la web */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:38px;padding:7px 18px;border-radius:999px;font:inherit;font-weight:800;font-size:13px;line-height:1.2;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:transform .3s var(--ease),border-color .2s,background .2s,box-shadow .3s}
.btn:hover{border-color:var(--fg);transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-accent:hover{border-color:var(--accent);box-shadow:0 12px 24px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;color:var(--faint);background:transparent;border:none;cursor:pointer;transition:background .2s,color .2s}
.icon-btn:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

/* Pestañas: como el menú de la web; la activa, amarilla con texto azul */
.tab{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:var(--muted);font:inherit;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:transparent;border:none;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--fg);background:var(--raised)}
.tab[aria-selected=true]{color:var(--egg-blue);background:var(--egg-yellow)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip-warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.chip-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.chip-good{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.chip-muted{background:var(--raised);color:var(--muted)}
.chip-action{border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-weight:800;transition:border-color .2s}
.chip-action:hover{border-color:var(--fg)}
.chip-action:disabled{opacity:.45;cursor:not-allowed}
/* Tipo de gasto: chip con un <select> invisible encima */
.tipo{position:relative;cursor:pointer}
.tipo select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.tipo:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tipo-mensual{background:color-mix(in srgb,var(--sub) 13%,transparent);color:var(--sub)}
.tipo-unica{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.periodo-fila{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--fg);font:inherit;font-weight:800;font-size:13px;cursor:pointer;padding:4px}
.switch-track{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch-track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch[aria-checked=true] .switch-track{background:var(--accent)}
.switch[aria-checked=true] .switch-track::after{transform:translateX(16px);background:var(--accent-ink)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.mes-sel{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px}
.mes-sel .icon-btn{color:var(--fg)}
.mes-sel .icon-btn:hover{color:var(--fg);background:var(--raised)}
.mes-sel .icon-btn:disabled{opacity:.3;cursor:not-allowed;background:none}
.mes-nombre{display:inline-block;min-width:170px;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.02em}
.mes-nombre::first-letter{text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.red-chip{font:inherit;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;border:1.5px solid var(--line-soft);background:transparent;color:var(--faint);cursor:pointer;transition:border-color .2s,color .2s}
.red-chip:hover{border-color:var(--line);color:var(--muted)}
.red-chip.on{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:transparent;color:var(--accent)}
.red-chip:focus-visible,.acc-head:focus-visible,.bar-hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cuentas: un desplegable por cliente */
.acc-head{width:100%;display:flex;align-items:center;gap:10px;padding:16px 18px;background:none;border:none;color:var(--fg);font:inherit;font-size:15px;cursor:pointer;text-align:left;border-radius:24px;transition:background .2s}
.acc-head:hover{background:var(--hover)}
.acc-chev{transition:transform .2s var(--ease);color:var(--muted)}
.acc-head[aria-expanded=true] .acc-chev{transform:rotate(90deg)}
.cuenta{background:var(--bg);border:1px solid var(--line-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.campo{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.campo .cell{border-color:var(--line-soft);background:var(--surface);font-weight:500}
.secreto{font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--fg)}
.cuenta .icon-btn{color:var(--muted)}
.cuenta .icon-btn:hover{color:var(--fg);background:var(--raised)}

/* Stats */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;font-weight:600;fill:var(--muted)}
.chart .tick-y{font-variant-numeric:tabular-nums}
.chart .valor{fill:var(--fg);font-weight:800}
.bar-mark{fill:var(--chart);transition:fill .1s}
.bar-hit{fill:transparent;cursor:default;outline:none}
.bar-g.activa .bar-mark{fill:var(--chart-hi)}
.chart-tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:10px 12px;font-size:12px;white-space:nowrap;box-shadow:var(--shadow);transform:translateX(-50%);z-index:2}
.chart-tip .fila{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chart-tip .key{width:10px;height:2px;border-radius:2px;display:inline-block}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:12px;font-weight:700;color:var(--muted)}
.leyenda>span{display:inline-flex;align-items:center;gap:6px}
.ley-rect{width:10px;height:10px;border-radius:3px;display:inline-block}
.ley-linea{width:14px;height:2px;border-radius:2px;display:inline-block}
.bar-g.activa path{filter:brightness(1.12)}

/* Pagos: fila compacta y descuentos al desplegar */
.sub{font-size:11px;font-weight:600;color:var(--muted);line-height:1.3}
.fila-toggle{display:flex;align-items:center;gap:6px;width:100%;min-width:0;background:none;border:none;padding:7px 4px;color:var(--fg);font:inherit;font-weight:800;cursor:pointer;text-align:left;border-radius:10px}
.fila-toggle:hover{background:var(--raised)}
.fila-toggle[aria-expanded=true] .acc-chev{transform:rotate(90deg)}
.fila-toggle:focus-visible,.link-num:focus-visible,.link-mes:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table.tbl tr.detalle-fila td,table.tbl tbody tr.detalle-fila:hover td{background:var(--bg);padding:0}
.detalle{position:sticky;left:0;max-width:min(880px,calc(100vw - 48px));padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.desc-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.desc-linea{display:flex;justify-content:space-between;gap:16px;font-size:13px;border-bottom:1px dashed var(--line-soft);padding:4px 0}
.cubre{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.cubre input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;margin:0}
.link-num{background:none;border:none;padding:0;font:inherit;color:var(--bad);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.link-mes{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--fg);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
table.tbl tr.fila-mes{cursor:pointer}
.pct-mes{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13px}
.aviso{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600}
.aviso svg{flex:none;margin-top:2px}
.aviso-warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.aviso-bad{background:color-mix(in srgb,var(--bad) 11%,transparent);color:var(--bad)}
.aviso-good{background:color-mix(in srgb,var(--good) 11%,transparent);color:var(--good)}

.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:4px}
.seg button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;font:inherit;font-weight:800;font-size:12px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-bar">
    <a class="logo-link" href="/" title="Ir a eggeo.com.ar"><!--LOGO--></a>
    <span class="hd-tag hidden sm:inline">Backoffice</span>
    <div id="hd-actions" class="hd-actions"></div>
  </div>
</header>
<div id="root"></div>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react = window.React; // el UMD de lucide-react busca React en minúscula</script>
<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const L = window.LucideReact || {};
const Icon = ({ name, size = 16, ...p }) => {
  const C = L[name];
  return C ? <C size={size} strokeWidth={1.8} {...p} /> : <span style={{ width: size, height: size, display: "inline-block" }} />;
};

const SOCIOS = [
  { key: "manu", name: "Manu", color: "var(--manu)" },
  { key: "elias", name: "Elias", color: "var(--elias)" },
  { key: "nico", name: "Nico", color: "var(--nico)" },
];
const PAGADORES = ["Agencia", "Manu", "Elias", "Nico"];

const uid = () => crypto.randomUUID();
const money = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Math.round(n || 0));
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ---------- Datos compartidos (D1 vía /hueveados/api) ---------- */
// Se manda solo lo que cambió respecto del último estado confirmado por el servidor: campos editados,
// altas y bajas. Así nunca se pisa lo que otro socio agregó o editó en otros registros; si dos
// editan el mismo campo, gana el último en guardar.
const API = "/hueveados/api";
const COLECCIONES = ["clients", "expenses", "payments", "cobros"];
const AJUSTES = ["reparto"];
const VACIO = { clients: [], expenses: [], payments: [], cobros: [], reparto: "proporcional" };
const SAVE_DELAY = 800;
const POLL_MS = 20000;
const RETRY_MS = 5000;

class SesionVencida extends Error {}
async function api(path, options) {
  const res = await fetch(API + path, { credentials: "same-origin", cache: "no-store", ...options });
  if (res.status === 401) { location.href = "/hueveados/login"; throw new SesionVencida(); }
  if (!res.ok) {
    let mensaje = `HTTP ${res.status}`;
    try { mensaje = (await res.json()).error || mensaje; } catch {}
    throw new Error(mensaje);
  }
  return res.json();
}

function indexar(state) {
  const m = new Map();
  COLECCIONES.forEach((col) => state[col].forEach((r) => m.set(`${col}/${r.id}`, { col, r })));
  return m;
}

function diferencias(desde, hasta) {
  const upserts = [], deletes = [];
  const a = indexar(desde), b = indexar(hasta);
  for (const [k, { col, r }] of b) {
    const prev = a.get(k)?.r;
    const { id, ...campos } = r;
    const data = {};
    for (const f in campos) if (!prev || campos[f] !== prev[f]) data[f] = campos[f];
    if (Object.keys(data).length) upserts.push({ collection: col, id, data });
  }
  for (const [k, { col, r }] of a) if (!b.has(k)) deletes.push({ collection: col, id: r.id });
  const ajustes = {};
  AJUSTES.forEach((f) => { if (hasta[f] !== desde[f]) ajustes[f] = hasta[f]; });
  if (Object.keys(ajustes).length) upserts.push({ collection: "settings", id: "main", data: ajustes });
  return { upserts, deletes };
}
const sinCambios = (c) => c.upserts.length === 0 && c.deletes.length === 0;

function aplicar(state, { upserts, deletes }) {
  let next = { ...state };
  for (const u of upserts) {
    if (u.collection === "settings") { next = { ...next, ...u.data }; continue; }
    const list = next[u.collection];
    next[u.collection] = list.some((r) => r.id === u.id)
      ? list.map((r) => (r.id === u.id ? { ...r, ...u.data } : r))
      : [...list, { id: u.id, ...u.data }];
  }
  for (const d of deletes) next[d.collection] = next[d.collection].filter((r) => r.id !== d.id);
  return next;
}

function useDatosCompartidos() {
  const [data, setDataState] = useState(null);
  const [user, setUser] = useState("");
  const [status, setStatus] = useState("loading"); // loading | saved | saving | error
  const [loadError, setLoadError] = useState(false);
  const base = useRef(null);    // último estado confirmado por el servidor
  const actual = useRef(null);  // estado local, con lo que todavía no se guardó
  const enVuelo = useRef(null); // guardado en curso
  const timer = useRef(null);

  const pendiente = () => base.current && actual.current && !sinCambios(diferencias(base.current, actual.current));
  const recibir = (srv) => { const { user, ...state } = srv; if (user) setUser(user); base.current = state; return state; };
  const mostrar = (state) => { actual.current = state; setDataState(state); };

  const guardar = useCallback(() => {
    clearTimeout(timer.current);
    if (enVuelo.current) return enVuelo.current; // al terminar se vuelve a programar si quedó algo
    if (!pendiente()) { if (base.current) setStatus("saved"); return Promise.resolve(); }
    const enviado = actual.current;
    setStatus("saving");
    enVuelo.current = (async () => {
      try {
        const srv = recibir(await api("/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(diferencias(base.current, enviado)),
          keepalive: true,
        }));
        // Lo que se editó mientras viajaba el pedido se vuelve a aplicar sobre la respuesta.
        const resto = diferencias(enviado, actual.current);
        mostrar(aplicar(srv, resto));
        if (sinCambios(resto)) setStatus("saved");
        else timer.current = setTimeout(guardar, SAVE_DELAY);
      } catch (e) {
        if (e instanceof SesionVencida) return;
        setStatus("error");
        timer.current = setTimeout(guardar, RETRY_MS);
      } finally {
        enVuelo.current = null;
      }
    })();
    return enVuelo.current;
  }, []);

  // Mismo uso que setState; actualiza la referencia en el acto para que ningún guardado la pise.
  const setData = useCallback((fn) => {
    const next = typeof fn === "function" ? fn(actual.current) : fn;
    actual.current = next;
    setDataState(next);
    setStatus("saving");
    clearTimeout(timer.current);
    timer.current = setTimeout(guardar, SAVE_DELAY);
  }, [guardar]);

  const cargar = useCallback(async () => {
    setLoadError(false);
    try { mostrar(recibir(await api("/data"))); setStatus("saved"); }
    catch (e) { if (!(e instanceof SesionVencida)) setLoadError(true); }
  }, []);

  // Trae los cambios de los otros socios cuando no hay nada propio pendiente.
  const refrescar = useCallback(async () => {
    if (!base.current || enVuelo.current || pendiente() || document.hidden) return;
    try {
      const srv = await api("/data");
      if (enVuelo.current || pendiente()) return;
      mostrar(recibir(srv));
    } catch {}
  }, []);

  // Guarda todo lo pendiente (antes de cerrar sesión).
  const flush = useCallback(async () => {
    for (let i = 0; i < 3 && (pendiente() || enVuelo.current); i++) await guardar();
  }, [guardar]);

  useEffect(() => {
    cargar();
    const poll = setInterval(refrescar, POLL_MS);
    const onVisible = () => (document.hidden ? guardar() : refrescar());
    const onUnload = (e) => { if (pendiente() || enVuelo.current) { guardar(); e.preventDefault(); e.returnValue = ""; } };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("beforeunload", onUnload);
    return () => {
      clearInterval(poll);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("beforeunload", onUnload);
    };
  }, []);

  return { data, setData, status, user, loadError, reload: cargar, flush };
}

/* ---------- Meses ---------- */
const MESES_LARGOS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const INICIO = "2026-11"; // el sistema arranca en noviembre 2026: no hay meses anteriores
const aMes = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const mesActual = () => { const m = aMes(new Date()); return m < INICIO ? INICIO : m; };
const sumarMeses = (ym, n) => { const [y, m] = ym.split("-").map(Number); return aMes(new Date(y, m - 1 + n, 1)); };
const mesMax = (a, b) => (a > b ? a : b);

function monthsSince(ym) {
  if (!ym) return null;
  const [y, m] = ym.split("-").map(Number);
  const now = new Date();
  return (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
}
const fmtMonth = (ym) => { if (!ym) return "—"; const [y, m] = ym.split("-"); return `${MESES[+m - 1]} ${y}`; };
const fmtMesLargo = (ym) => { const [y, m] = ym.split("-"); return `${MESES_LARGOS[+m - 1]} ${y}`; };
const fmtDia = (iso) => { if (!iso) return ""; const [, m, d] = iso.split("-"); return `${+d} ${MESES[+m - 1]}`; };
const fmtPct = (x) => `${(x * 100).toFixed(1).replace(".", ",")}%`;

/* ---------- Gastos por mes ---------- */
const SECCIONES = [
  { key: "plataformas", titulo: "Plataformas", corto: "Plataformas" },
  { key: "operativos", titulo: "Gastos operativos", corto: "Operativos" },
  { key: "editores", titulo: "Editores y CM", corto: "Editores y CM" },
];
// Gastos anteriores a las secciones: la sección sale de la categoría.
const seccionDe = (e) => e.seccion || (e.categoria === "Editor" || e.categoria === "CM" ? "editores" : "plataformas");
// Un gasto sin "tipo" (anterior a la migración) se toma como suscripción mensual.
const esMensual = (e) => e.tipo !== "unica";
const sinFecha = (e) => (esMensual(e) ? !e.desde : !e.mes);
function aplicaEnMes(e, ym) {
  if (!esMensual(e)) return e.mes === ym;
  return !!e.desde && e.desde <= ym && (!e.hasta || e.hasta >= ym);
}
const suma = (list, val = (x) => x.monto) => list.reduce((s, x) => s + (+val(x) || 0), 0);

/* ---------- Cálculo de un mes ---------- */
// Un pago cuenta en el mes en que entra la plata ("mes"); "servicio" es el mes que se paga.
const clienteActivo = (c, ym) => (c.activoDesde || INICIO) <= ym && (!c.activoHasta || c.activoHasta >= ym);
const mesServicio = (c, mesCobro) => (c.modalidad === "vencido" ? sumarMeses(mesCobro, -1) : mesCobro);
// En el mes M se le cobra a un cliente si estuvo activo en el mes de servicio. Al inicio del sistema,
// los que pagan a mes vencido cobran en noviembre el servicio de octubre.
const cobraEnMes = (c, ym) => clienteActivo(c, mesMax(mesServicio(c, ym), INICIO));
const idMes = (clienteId, mes) => `${clienteId}_${mes}`;
const socioPorNombre = (nombre) => SOCIOS.find((s) => s.name === nombre);

// Todo lo de un mes sale de acá: tarjetas, Liquidación, Pagos e Historial usan los mismos números.
// La base de cada cliente es el monto cobrado si ya pagó, o su fee. El reparto es el actual del cliente
// (el guardado en el pago solo se usa si el cliente ya no existe).
function calcularMes(data, mes) {
  const pagos = new Map(data.payments.filter((p) => p.mes === mes).map((p) => [p.cliente, p]));
  const filas = data.clients.filter((c) => cobraEnMes(c, mes)).map((c) => ({ c, pago: pagos.get(c.id) }));
  // Un cobro del mes de un cliente borrado o fuera de período igual entró: se cuenta.
  for (const p of pagos.values()) {
    if (!filas.some((r) => r.c.id === p.cliente)) {
      filas.push({ c: { id: p.cliente, cliente: p.nombre || "Cliente borrado", precio: p.monto, manu: p.manu, elias: p.elias, nico: p.nico, modalidad: "corriente" }, pago: p, huerfano: true });
    }
  }
  for (const r of filas) {
    const fuente = r.huerfano ? r.pago : r.c;
    r.base = +(r.pago ? r.pago.monto : r.c.precio) || 0;
    r.pct = { manu: +fuente.manu || 0, elias: +fuente.elias || 0, nico: +fuente.nico || 0 };
    r.servicio = r.pago?.servicio || mesServicio(r.c, mes);
  }

  const ingresos = suma(filas, (r) => r.base);
  const pagados = filas.filter((r) => r.pago);
  const cobrado = suma(pagados, (r) => r.pago.monto);
  const gastosMes = data.expenses.filter((e) => aplicaEnMes(e, mes));
  const gastos = suma(gastosMes);
  const porSeccion = Object.fromEntries(SECCIONES.map(({ key }) => [key, suma(gastosMes.filter((e) => seccionDe(e) === key))]));
  const fijos = suma(gastosMes.filter(esMensual));

  const bruto = { manu: 0, elias: 0, nico: 0 };
  const porCliente = filas.map((r) => {
    const row = { id: r.c.id, cliente: r.c.cliente, precio: r.base };
    SOCIOS.forEach(({ key }) => { row[key] = (r.base * r.pct[key]) / 100; bruto[key] += row[key]; });
    row.sinAsignar = row.precio - row.manu - row.elias - row.nico;
    return row;
  });
  const totalBruto = bruto.manu + bruto.elias + bruto.nico;
  const liq = {}, liqProp = {}, pctMes = {};
  SOCIOS.forEach(({ key, name }) => {
    const pesoProp = totalBruto ? bruto[key] / totalBruto : 1 / 3;
    const peso = data.reparto === "iguales" ? 1 / 3 : pesoProp;
    const reintegro = suma(gastosMes.filter((e) => e.pagadoPor === name));
    const asignado = gastos * peso;
    liq[key] = { bruto: bruto[key], peso, asignado, reintegro, ganancia: bruto[key] - asignado, neto: bruto[key] - asignado + reintegro };
    liqProp[key] = bruto[key] - gastos * pesoProp + reintegro; // "según participación", para verificar Pagos
    pctMes[key] = ingresos ? bruto[key] / ingresos : 1 / 3; // participación sobre la facturación del mes
  });
  const sinAsignar = porCliente.reduce((s, r) => s + r.sinAsignar, 0);
  return {
    mes, filas, ingresos, cobrado, nPagos: pagados.length, gastos, gastosMes, porSeccion, fijos, unicos: gastos - fijos,
    neto: ingresos - gastos, margen: ingresos ? (ingresos - gastos) / ingresos : 0, porCliente, liq, liqProp, pctMes, sinAsignar,
  };
}
const useFinanzas = (data, mes) => useMemo(() => calcularMes(data, mes), [data, mes]);

// Pagos: descuentos de cada cobro y reparto. Los editores/CM asignados a una cuenta se pagan con el cobro
// de esa cuenta. El resto (plataformas, operativos y editores/CM generales) lo cubren los clientes marcados,
// en el orden en que se marcaron y hasta su monto: primero lo que se paga a terceros, después los reintegros.
function repartirCobros(data, mes, f) {
  const cubre = new Map(data.cobros.filter((x) => x.mes === mes && +x.cubre > 0).map((x) => [x.cliente, +x.cubre]));
  const enFilas = new Set(f.filas.map((r) => r.c.id));
  const tercero = (e, monto) => ({ tipo: "tercero", texto: seccionDe(e) === "editores" ? `Pagar a editor/CM ${e.concepto}` : `Pagar ${e.concepto}`, monto, total: monto });

  const propios = new Map();
  const terceros = [];
  const reintegroSocio = {};
  for (const e of f.gastosMes) {
    const monto = +e.monto || 0;
    if (!monto) continue;
    const pagaSocio = socioPorNombre(e.pagadoPor);
    if (seccionDe(e) === "editores" && e.cuenta && e.cuenta !== "general" && enFilas.has(e.cuenta)) {
      const l = pagaSocio
        ? { tipo: "reintegro", socio: pagaSocio.key, texto: `Reintegrar a ${pagaSocio.name}`, nota: `editor/CM ${e.concepto}`, monto, total: monto }
        : tercero(e, monto);
      propios.set(e.cuenta, [...(propios.get(e.cuenta) || []), l]);
    } else if (pagaSocio) {
      reintegroSocio[pagaSocio.key] = (reintegroSocio[pagaSocio.key] || 0) + monto;
    } else {
      terceros.push(tercero(e, monto));
    }
  }
  const comunes = [
    ...terceros,
    ...SOCIOS.filter((s) => reintegroSocio[s.key]).map((s) => ({ tipo: "reintegro", socio: s.key, texto: `Reintegrar a ${s.name}`, monto: reintegroSocio[s.key], total: reintegroSocio[s.key] })),
  ];
  const totalComunes = suma(comunes);

  const marcados = f.filas.filter((r) => cubre.has(r.c.id)).sort((a, b) => cubre.get(a.c.id) - cubre.get(b.c.id));
  const pendientes = comunes.map((l) => ({ ...l, restante: l.monto }));
  const cubierto = new Map();
  let k = 0;
  for (const r of marcados) {
    let capacidad = Math.max(0, r.base - suma(propios.get(r.c.id) || []));
    const lineas = [];
    while (capacidad > 0.005 && k < pendientes.length) {
      const l = pendientes[k];
      const toma = Math.min(capacidad, l.restante);
      lineas.push({ tipo: l.tipo, socio: l.socio, texto: l.texto, nota: l.nota, monto: toma, total: l.total });
      l.restante -= toma;
      capacidad -= toma;
      if (l.restante <= 0.005) k++;
    }
    cubierto.set(r.c.id, lineas);
  }
  const faltante = suma(pendientes, (l) => l.restante);

  const filas = f.filas.map((r) => {
    const desc = [...(propios.get(r.c.id) || []), ...(cubierto.get(r.c.id) || [])];
    const descuentos = suma(desc);
    const aRepartir = r.base - descuentos;
    const parte = Object.fromEntries(SOCIOS.map(({ key }) => [key, aRepartir * f.pctMes[key]]));
    return { ...r, desc, descuentos, aRepartir, parte, orden: marcados.indexOf(r) + 1 };
  });
  const total = { base: suma(filas, (x) => x.base), descuentos: suma(filas, (x) => x.descuentos), aRepartir: suma(filas, (x) => x.aRepartir), parte: {}, reintegro: {}, socio: {} };
  SOCIOS.forEach(({ key }) => {
    total.parte[key] = suma(filas, (x) => x.parte[key]);
    total.reintegro[key] = suma(filas.flatMap((x) => x.desc).filter((l) => l.tipo === "reintegro" && l.socio === key));
    total.socio[key] = total.parte[key] + total.reintegro[key];
  });
  const diferencias = SOCIOS.filter(({ key }) => Math.abs(total.socio[key] - f.liqProp[key]) > 1);
  const ultimo = marcados.length ? marcados[marcados.length - 1].c.id : null;
  return { filas, totalComunes, faltante, hayMarcados: marcados.length > 0, ultimo, total, diferencias };
}

/* ---------- Tablas ---------- */
// table-layout: fixed + <colgroup>: el encabezado y las filas usan los mismos anchos. La tabla llena
// el panel y, si las columnas no entran, scrollea en horizontal dentro de él.
// fijarPrimera: la primera columna queda fija a la izquierda al scrollear (con sombra mientras hay scroll).
function Tabla({ cols, fijarPrimera = false, children }) {
  const ancho = cols.reduce((s, w) => s + w, 0);
  const [desplazada, setDesplazada] = useState(false);
  const onScroll = fijarPrimera ? (e) => setDesplazada(e.currentTarget.scrollLeft > 0) : undefined;
  return (
    <div className={`scroll-x${desplazada ? " desplazada" : ""}`} onScroll={onScroll}>
      <table className={`tbl${fijarPrimera ? " fija-1" : ""}`} style={{ width: `max(100%, ${ancho}px)` }}>
        <colgroup>{cols.map((w, i) => <col key={i} style={{ width: w }} />)}</colgroup>
        {children}
      </table>
    </div>
  );
}

// Input de celda: si el texto no entra, al pasar el mouse muestra el valor completo.
function Celda({ className = "", value, ...p }) {
  const tooltip = (e) => { const el = e.currentTarget; el.title = el.scrollWidth > el.clientWidth ? String(value ?? "") : ""; };
  return <input className={`cell ${className}`} value={value} onMouseEnter={tooltip} {...p} />;
}

                    {SOCIOS.map((s) => (
                      <input key={s.key} id={`c-${c.id}-${s.key}`} aria-label={`% ${s.name}`} className="cell num pct" type="number" min="0" max="100" value={c[s.key]} style={{ color: s.color }} onChange={(e) => upd(c.id, s.key, numero(e))} />
                    ))}
                  </div>
                  <div className="flex justify-center mt-1">
                    {sum === 100 ? <span className="chip chip-good"><Icon name="Check" size={12} />100%</span> : <span className="chip chip-bad"><Icon name="AlertTriangle" size={12} />Suma {sum}%</span>}
                  </div>
                </td>
                <td>
                  <div className="flex flex-col gap-1">
                    <MesCampo id={`c-${c.id}-activoDesde`} label="Desde" value={c.activoDesde} invalido={!c.activoDesde} title={c.activoDesde ? undefined : "Falta el mes de inicio (obligatorio)"} onChange={(v) => upd(c.id, "activoDesde", v)} />
                    <MesCampo id={`c-${c.id}-activoHasta`} label="Hasta" value={c.activoHasta} title={c.activoHasta ? undefined : "Vacío: sigue activo"} onChange={(v) => upd(c.id, "activoHasta", v)} />
                  </div>
                </td>
                <td><RedesToggle cliente={c} onToggle={(red, v) => upd(c.id, red, v)} /></td>
                <td className="r">
                  {confirmId === c.id ? (
                    <div className="flex items-center justify-end gap-1">
                      <button className="chip chip-bad" style={{ border: "none", cursor: "pointer" }} onClick={() => del(c.id)}>Borrar</button>
                      <button className="icon-btn" aria-label="Cancelar" onClick={() => setConfirmId(null)}><Icon name="X" size={14} /></button>
                    </div>
                  ) : (
                    <div className="flex items-center justify-end gap-1">
                      {c.activoHasta ? (
                        <button className="chip chip-action" title="Quitar la fecha de fin: vuelve a quedar activo" onClick={() => upd(c.id, "activoHasta", "")}>Reactivar</button>
                      ) : activo ? (
                        <button className="chip chip-action" disabled={c.activoDesde === mes} title={c.activoDesde === mes ? "Empezó este mes: usá Borrar" : `Deja de facturar desde ${fmtMesLargo(mes)}`} onClick={() => upd(c.id, "activoHasta", sumarMeses(mes, -1))}>Dar de baja</button>
                      ) : null}
                      <button className="icon-btn" aria-label={`Eliminar ${c.cliente}`} onClick={() => setConfirmId(c.id)}><Icon name="Trash2" size={15} /></button>
                    </div>
                  )}
                </td>
              </tr>
            );
          })}
        </tbody>
        <tfoot>
          <tr>
            <td colSpan={3}><span className="eyebrow">Subtotal · {activos.length} activos en {fmtMonth(mes)}</span></td>
            <td className="num r" style={{ color: "var(--accent)" }}>{money(total)}</td>
            <td colSpan={8}></td>
          </tr>
        </tfoot>
      </Tabla>
    </div>
  );
}

/* ---------- Gastos ---------- */
// Plataformas y Operativos: Concepto · Tipo · Período · Pagado por · Monto · Nota · acciones.
// Editores y CM suma Rol y Cuenta (el cliente para el que trabaja, o General).
const COLS_GASTOS = [200, 130, 240, 140, 130, 170, 130];
const COLS_EDITORES = [180, 110, 170, 130, 240, 130, 130, 140, 130];
const ROLES = ["Editor", "CM"];

function TipoChip({ id, value, onChange }) {
  const mensual = value !== "unica";
  return (
    <span className={`chip tipo ${mensual ? "tipo-mensual" : "tipo-unica"}`}>
      <Icon name={mensual ? "Repeat" : "Calendar"} size={12} />
      {mensual ? "Mensual" : "Única vez"}
      <Icon name="ChevronDown" size={12} />
      <select id={id} aria-label="Tipo de gasto" value={mensual ? "mensual" : "unica"} onChange={(e) => onChange(e.target.value)}>
        <option value="mensual">Mensual (suscripción)</option>
        <option value="unica">Única vez</option>
      </select>
    </span>
  );
}

// Campo de mes: no deja elegir meses anteriores al inicio del sistema.
function MesCampo({ id, label, value, onChange, invalido, title }) {
  return (
    <label className="periodo-fila" title={title}>
      <span>{label}</span>
      <input id={id} type="month" min={INICIO} className={`cell${invalido ? " invalido" : ""}`} value={value || ""} onChange={(e) => onChange(e.target.value && e.target.value < INICIO ? INICIO : e.target.value)} />
    </label>
  );
}

function Periodo({ e, upd }) {
  if (!esMensual(e)) {
    return <MesCampo id={`e-${e.id}-mes`} label="Mes" value={e.mes} invalido={!e.mes} title={e.mes ? undefined : "Falta el mes"} onChange={(v) => upd(e.id, "mes", v)} />;
  }
  return (
    <div className="flex flex-col gap-1">
      <MesCampo id={`e-${e.id}-desde`} label="Desde" value={e.desde} invalido={!e.desde} title={e.desde ? undefined : "Falta el mes de inicio (obligatorio)"} onChange={(v) => upd(e.id, "desde", v)} />
      <MesCampo id={`e-${e.id}-hasta`} label="Hasta" value={e.hasta} title={e.hasta ? undefined : "Vacío: sigue activa"} onChange={(v) => upd(e.id, "hasta", v)} />
    </div>
  );
}

const SECCIONES_GASTOS = [
  {
    key: "plataformas", hint: "Suscripciones y herramientas. Indicá qué socio la paga para reintegrársela.", boton: "Agregar plataforma",
    nuevo: () => ({ concepto: "Nueva plataforma", pagadoPor: "Manu", tipo: "mensual", desde: mesActual(), hasta: "", mes: "" }),
  },
  {
    key: "operativos", hint: "Gastos variables: viáticos, alquiler de equipos, gente para filmar…", boton: "Agregar gasto",
    nuevo: () => ({ concepto: "Nuevo gasto", pagadoPor: "Agencia", tipo: "unica", mes: mesActual(), desde: "", hasta: "" }),
  },
  {
    key: "editores", hint: "Equipo externo. Asignalo a la cuenta para la que trabaja (se paga con ese cobro) o a General si trabaja para varias.", boton: "Agregar editor/CM",
    nuevo: () => ({ concepto: "Nuevo editor", rol: "Editor", cuenta: "general", pagadoPor: "Agencia", tipo: "mensual", desde: mesActual(), hasta: "", mes: "" }),
  },
];

function ExpensesTab({ data, setData, f, mes }) {
  const [confirmId, setConfirmId] = useState(null);
  const [verTodos, setVerTodos] = useState(false);
  // Gastos recién agregados o editados en este mes: siguen a la vista aunque dejen de aplicar.
  const [fijados, setFijados] = useState(() => new Set());
  useEffect(() => setFijados(new Set()), [mes]);
  const fijar = (id) => setFijados((s) => (s.has(id) ? s : new Set(s).add(id)));

  const editar = (id, cambio) => { fijar(id); setData((d) => ({ ...d, expenses: d.expenses.map((x) => (x.id === id ? { ...x, ...cambio(x) } : x)) })); };
  const upd = (id, field, val) => editar(id, () => ({ [field]: val }));
  const cambiarTipo = (id, tipo) => editar(id, (x) => (tipo === "mensual" ? { tipo, desde: x.desde || x.mes || mesActual() } : { tipo, mes: x.mes || x.desde || mesActual() }));
  const darDeBaja = (id) => upd(id, "hasta", sumarMeses(mes, -1));
  const add = (seccion) => {
    const id = uid();
    fijar(id);
    const nuevo = SECCIONES_GASTOS.find((s) => s.key === seccion).nuevo();
    setData((d) => ({ ...d, expenses: [...d.expenses, { id, monto: 0, nota: "", rol: "", cuenta: "", ...nuevo, seccion }] }));
  };
  const del = (id) => { setData((d) => ({ ...d, expenses: d.expenses.filter((x) => x.id !== id) })); setConfirmId(null); };
  const visible = (e) => verTodos || aplicaEnMes(e, mes) || sinFecha(e) || fijados.has(e.id);
  const clientesOrdenados = [...data.clients].sort((a, b) => String(a.cliente).localeCompare(String(b.cliente), "es"));

  const nMensuales = f.gastosMes.filter(esMensual).length;
  const nUnicos = f.gastosMes.length - nMensuales;

  const filaGasto = (e, editores) => {
    const socio = socioPorNombre(e.pagadoPor);
    const aplica = aplicaEnMes(e, mes);
    return (
      <tr key={e.id} className={aplica || sinFecha(e) ? "" : "fuera"}>
        <td><Celda id={`e-${e.id}-concepto`} className="font-semibold" value={e.concepto} onChange={(ev) => upd(e.id, "concepto", ev.target.value)} /></td>
        {editores && (
          <td>
            <select id={`e-${e.id}-rol`} className="cell" value={e.rol || "Editor"} onChange={(ev) => upd(e.id, "rol", ev.target.value)} aria-label="Rol">
              {ROLES.map((r) => <option key={r}>{r}</option>)}
            </select>
          </td>
        )}
        {editores && (
          <td>
            <select id={`e-${e.id}-cuenta`} className="cell" value={e.cuenta || "general"} onChange={(ev) => upd(e.id, "cuenta", ev.target.value)} aria-label="Cuenta">
              <option value="general">General</option>
              {clientesOrdenados.map((c) => <option key={c.id} value={c.id}>{c.cliente}{clienteActivo(c, mes) ? "" : " (inactivo)"}</option>)}
            </select>
          </td>
        )}
        <td><TipoChip id={`e-${e.id}-tipo`} value={e.tipo} onChange={(t) => cambiarTipo(e.id, t)} /></td>
        <td><Periodo e={e} upd={upd} /></td>
        <td>
          <div className="flex items-center gap-1 min-w-0">
            <span className="dot" style={{ background: socio ? socio.color : "var(--faint)" }} />
            <select id={`e-${e.id}-pago`} className="cell" value={e.pagadoPor} onChange={(ev) => upd(e.id, "pagadoPor", ev.target.value)} aria-label="Pagado por">
              {PAGADORES.map((p) => <option key={p}>{p}</option>)}
            </select>
          </div>
        </td>
        <td><Celda id={`e-${e.id}-monto`} className="num" type="number" min="0" step="1000" value={e.monto} onChange={(ev) => upd(e.id, "monto", ev.target.value === "" ? "" : +ev.target.value)} /></td>
        <td><Celda id={`e-${e.id}-nota`} style={{ color: "var(--muted)" }} value={e.nota} placeholder="—" onChange={(ev) => upd(e.id, "nota", ev.target.value)} /></td>
        <td className="r">
          {confirmId === e.id ? (
            <div className="flex items-center justify-end gap-1">
              <button className="chip chip-bad" style={{ border: "none", cursor: "pointer" }} onClick={() => del(e.id)}>Borrar</button>
              <button className="icon-btn" aria-label="Cancelar" onClick={() => setConfirmId(null)}><Icon name="X" size={14} /></button>
            </div>
          ) : (
            <div className="flex items-center justify-end gap-1">
              {esMensual(e) && e.hasta ? (
                <button className="chip chip-action" title="Quitar la fecha de fin: vuelve a quedar activa" onClick={() => upd(e.id, "hasta", "")}>Reactivar</button>
              ) : esMensual(e) && aplica ? (
                <button className="chip chip-action" disabled={e.desde === mes} title={e.desde === mes ? "Empezó este mes: usá Borrar" : `Deja de contar desde ${fmtMesLargo(mes)}`} onClick={() => darDeBaja(e.id)}>Dar de baja</button>
              ) : null}
              <button className="icon-btn" aria-label={`Eliminar ${e.concepto}`} onClick={() => setConfirmId(e.id)}><Icon name="Trash2" size={15} /></button>
            </div>
          )}
        </td>
      </tr>
    );
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        {SECCIONES.map(({ key, titulo }) => (
          <div key={key} className="panel p-4 flex items-center justify-between gap-3">
            <div>
              <div className="eyebrow">{titulo} · {fmtMonth(mes)}</div>
              <div className="num big-num text-lg mt-1">{money(f.porSeccion[key])}</div>
            </div>
            <span className="chip chip-muted num">{f.gastos ? ((f.porSeccion[key] / f.gastos) * 100).toFixed(0) : 0}%</span>
          </div>
        ))}
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div className="panel p-4 flex items-center justify-between gap-3">
          <div>
            <div className="eyebrow">Fijos mensuales · {fmtMonth(mes)}</div>
            <div className="num big-num text-lg mt-1">{money(f.fijos)}</div>
            <div className="text-xs mt-1" style={{ color: "var(--muted)" }}>{nMensuales} suscripcion{nMensuales === 1 ? "" : "es"} activa{nMensuales === 1 ? "" : "s"}</div>
          </div>
          <span className="chip tipo-mensual"><Icon name="Repeat" size={12} />Mensual</span>
        </div>
        <div className="panel p-4 flex items-center justify-between gap-3">
          <div>
            <div className="eyebrow">Únicos · {fmtMonth(mes)}</div>
            <div className="num big-num text-lg mt-1">{money(f.unicos)}</div>
            <div className="text-xs mt-1" style={{ color: "var(--muted)" }}>{nUnicos} gasto{nUnicos === 1 ? "" : "s"} de única vez</div>
          </div>
          <span className="chip tipo-unica"><Icon name="Calendar" size={12} />Única vez</span>
        </div>
      </div>

      <div className="flex flex-wrap items-center justify-between gap-3">
        <p className="text-xs" style={{ color: "var(--muted)" }}>
          {verTodos ? `Historial completo. Los gastos que no corresponden a ${fmtMesLargo(mes)} se ven atenuados.` : `Gastos que aplican a ${fmtMesLargo(mes)}.`}
        </p>
        <button className="switch" role="switch" aria-checked={verTodos} onClick={() => setVerTodos((v) => !v)}>
          <span className="switch-track" />Ver todos
        </button>
      </div>

      {SECCIONES_GASTOS.map((s) => {
        const { titulo } = SECCIONES.find((x) => x.key === s.key);
        const editores = s.key === "editores";
        const rows = data.expenses.filter((e) => seccionDe(e) === s.key && visible(e));
        const nCols = editores ? COLS_EDITORES.length : COLS_GASTOS.length;
        return (
          <div key={s.key} className="panel">
            <div className="flex flex-wrap items-center justify-between gap-3 p-4" style={{ borderBottom: "1px solid var(--line-soft)" }}>
              <div>
                <h2 className="display text-lg font-bold">{titulo}</h2>
                <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>{s.hint}</p>
              </div>
              <button className="btn" onClick={() => add(s.key)}><Icon name="Plus" />{s.boton}</button>
            </div>
            <Tabla cols={editores ? COLS_EDITORES : COLS_GASTOS} fijarPrimera>
              <thead>
                <tr>
                  <th>Concepto</th>
                  {editores && <th>Rol</th>}
                  {editores && <th>Cuenta</th>}
                  <th>Tipo</th>
                  <th>Período</th>
                  <th>Pagado por</th>
                  <th className="r">Monto</th>
                  <th>Nota</th>
                  <th className="r"><span className="sr-only">Acciones</span></th>
                </tr>
              </thead>
              <tbody>
                {rows.length === 0 && (
                  <tr><td colSpan={nCols} className="text-center py-6" style={{ color: "var(--faint)" }}>{verTodos ? "Todavía no hay gastos en esta sección." : `No hay gastos de esta sección en ${fmtMesLargo(mes)}.`}</td></tr>
                )}
                {rows.map((e) => filaGasto(e, editores))}
              </tbody>
              <tfoot>
                <tr>
                  <td colSpan={nCols - 3}><span className="eyebrow">Subtotal · {fmtMonth(mes)}</span></td>
                  <td className="num r" style={{ color: "var(--bad)" }}>{money(f.porSeccion[s.key])}</td>
                  <td colSpan={2}></td>
                </tr>
              </tfoot>
            </Tabla>
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Liquidación ---------- */
const COLS_POR_CLIENTE = [220, 130, 130, 130, 130, 240];
const COLS_AJUSTE = [260, 150, 150, 150, 150];

function SettlementTab({ data, setData, f, mes }) {
  return (
    <div className="flex flex-col gap-4">
      <div className="panel">
        <div className="p-4" style={{ borderBottom: "1px solid var(--line-soft)" }}>
          <h2 className="display text-lg font-bold">Lo que genera cada socio por cliente</h2>
          <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>Fee del cliente × porcentaje de cada socio.</p>
        </div>
        <Tabla cols={COLS_POR_CLIENTE}>
          <thead>
            <tr>
              <th>Cliente</th>
              <th className="r">Fee</th>
              {SOCIOS.map((s) => <th key={s.key} className="r" style={{ color: s.color }}>{s.name}</th>)}
              <th>Reparto</th>
            </tr>
          </thead>
          <tbody>
            {f.porCliente.map((r) => (
              <tr key={r.id}>
                <td className="font-semibold py-3">
                  <div className="trunc" title={r.cliente}>{r.cliente}</div>
                  {Math.abs(r.sinAsignar) > 0.5 && <span className="chip chip-bad mt-1">{r.sinAsignar > 0 ? "Falta asignar" : "Excede"} {money(Math.abs(r.sinAsignar))}</span>}
                </td>
                <td className="num r" style={{ color: "var(--muted)" }}>{money(r.precio)}</td>
                {SOCIOS.map((s) => <td key={s.key} className="num r">{money(r[s.key])}</td>)}
                <td>
                  <div className="bar">
                    {SOCIOS.map((s) => <span key={s.key} style={{ width: `${r.precio ? Math.max(0, (r[s.key] / r.precio) * 100) : 0}%`, background: s.color }} />)}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr>
              <td><span className="eyebrow">Bruto por socio</span></td>
              <td className="num r" style={{ color: "var(--accent)" }}>{money(f.ingresos)}</td>
              {SOCIOS.map((s) => <td key={s.key} className="num r" style={{ color: s.color }}>{money(f.liq[s.key].bruto)}</td>)}
              <td></td>
            </tr>
          </tfoot>
        </Tabla>
      </div>

      <div className="panel">
        <div className="flex flex-wrap items-center justify-between gap-3 p-4" style={{ borderBottom: "1px solid var(--line-soft)" }}>
          <div>
            <h2 className="display text-lg font-bold">Ajuste por gastos y neto a cobrar · {fmtMonth(mes)}</h2>
            <p className="text-xs mt-1" style={{ color: "var(--muted)" }}>Los gastos de {fmtMesLargo(mes)} se reparten entre los socios y a quien pagó una plataforma de su bolsillo se le reintegra.</p>
          </div>
          <div className="flex flex-col gap-1 items-start">
            <span className="eyebrow">Criterio de reparto de gastos</span>
            <div className="seg" role="group">
              <button aria-pressed={data.reparto === "proporcional"} onClick={() => setData((d) => ({ ...d, reparto: "proporcional" }))}>Según participación</button>
              <button aria-pressed={data.reparto === "iguales"} onClick={() => setData((d) => ({ ...d, reparto: "iguales" }))}>Partes iguales</button>
            </div>
          </div>
        </div>
        <Tabla cols={COLS_AJUSTE}>
          <thead>
            <tr>
              <th>Concepto</th>
              {SOCIOS.map((s) => <th key={s.key} className="r" style={{ color: s.color }}>{s.name}</th>)}
              <th className="r">Agencia</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td className="py-3">Ingreso bruto</td>
              {SOCIOS.map((s) => <td key={s.key} className="num r">{money(f.liq[s.key].bruto)}</td>)}
              <td className="num r" style={{ color: "var(--muted)" }}>{money(f.ingresos)}</td>
            </tr>
            <tr>
              <td className="py-3">Peso en gastos</td>
              {SOCIOS.map((s) => <td key={s.key} className="num r" style={{ color: "var(--muted)" }}>{(f.liq[s.key].peso * 100).toFixed(1)}%</td>)}
              <td className="num r" style={{ color: "var(--muted)" }}>100%</td>
            </tr>
            <tr>
              <td className="py-3">Gastos asignados</td>
              {SOCIOS.map((s) => <td key={s.key} className="num r" style={{ color: "var(--bad)" }}>− {money(f.liq[s.key].asignado)}</td>)}
              <td className="num r" style={{ color: "var(--bad)" }}>− {money(f.gastos)}</td>
            </tr>
            <tr>
              <td className="py-3 font-semibold">Ganancia neta</td>
              {SOCIOS.map((s) => <td key={s.key} className="num r font-semibold" style={{ color: s.color }}>{money(f.liq[s.key].ganancia)}</td>)}
              <td className="num r font-semibold" style={{ color: "var(--accent)" }}>{money(f.neto)}</td>
            </tr>
            <tr>
              <td className="py-3">Reintegro por plataformas pagadas</td>
              {SOCIOS.map((s) => <td key={s.key} className="num r" style={{ color: f.liq[s.key].reintegro ? "var(--good)" : "var(--faint)" }}>{f.liq[s.key].reintegro ? "+ " + money(f.liq[s.key].reintegro) : "—"}</td>)}
              <td></td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td><span className="eyebrow" style={{ color: "var(--fg)" }}>A cobrar (ganancia + reintegro)</span></td>
              {SOCIOS.map((s) => <td key={s.key} className="num r text-base" style={{ color: s.color }}>{money(f.liq[s.key].neto)}</td>)}
              <td className="num r text-base" style={{ color: "var(--muted)" }}>{money(SOCIOS.reduce((t, s) => t + f.liq[s.key].neto, 0))}</td>
            </tr>
          </tfoot>
        </Tabla>
      </div>
    </div>
  );
}

/* ---------- Pagos ---------- */
// Una fila por cliente que se cobra en el mes. La fila muestra totales; los descuentos se ven al desplegarla.
const COLS_PAGOS = [210, 150, 130, 240, 120, 150, 130, 110, 110, 110];
const hoyISO = () => { const d = new Date(); return `${aMes(d)}-${String(d.getDate()).padStart(2, "0")}`; };

function EstadoPendiente({ precio, mes }) {
  if (!(+precio > 0)) return <span className="chip chip-muted">Sin fee</span>;
  const actual = mesActual();
  if (mes < actual) return <span className="chip chip-bad"><Icon name="AlertTriangle" size={12} />Atrasado</span>;
  if (mes === actual) return <span className="chip chip-warn"><Icon name="Clock" size={12} />Pendiente</span>;
  return <span className="chip chip-muted"><Icon name="CalendarClock" size={12} />Próximo</span>;
}

function LineaDescuento({ l }) {
  return (
    <li className="desc-linea">
      <span>{l.texto}{l.nota ? <span style={{ color: "var(--muted)" }}> · {l.nota}</span> : null}</span>
      <span className="num">{money(l.monto)}{l.monto < l.total - 0.5 ? <span style={{ color: "var(--muted)" }}> de {money(l.total)}</span> : null}</span>
    </li>
  );
}

function PagosTab({ data, setData, mes, user, f }) {
  const r = useMemo(() => repartirCobros(data, mes, f), [data, mes, f]);
  const [abiertos, setAbiertos] = useState(() => new Set());
  const [confirmId, setConfirmId] = useState(null);
  const alternar = (id) => setAbiertos((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const updCliente = (id, field, val) => setData((d) => ({ ...d, clients: d.clients.map((c) => (c.id === id ? { ...c, [field]: val } : c)) }));
  const updPago = (id, field, val) => setData((d) => ({ ...d, payments: d.payments.map((p) => (p.id === id ? { ...p, [field]: val } : p)) }));
  const marcar = (fila) => {
    const c = fila.c, id = idMes(c.id, mes), hoy = hoyISO();
    const pago = { id, cliente: c.id, nombre: c.cliente, mes, servicio: fila.servicio, monto: +c.precio || 0, fecha: hoy.startsWith(mes) ? hoy : `${mes}-01`, manu: +c.manu || 0, elias: +c.elias || 0, nico: +c.nico || 0, marcadoPor: user || "" };
    setData((d) => ({ ...d, payments: [...d.payments.filter((p) => p.id !== id), pago] }));
  };
  const deshacer = (id) => { setData((d) => ({ ...d, payments: d.payments.filter((p) => p.id !== id) })); setConfirmId(null); };
  const alternarCubre = (fila) => {
    const id = idMes(fila.c.id, mes);
    const registro = { id, cliente: fila.c.id, mes, cubre: fila.orden ? 0 : Date.now() };
    setData((d) => ({ ...d, cobros: [...d.cobros.filter((x) => x.id !== id), registro] }));
  };

  const pagados = r.filas.filter((x) => x.pago);
  const pendientes = r.filas.filter((x) => !x.pago && x.base > 0);

        <StatCard label="Por cobrar" value={money(suma(pendientes, (x) => x.base))} sub={`${pendientes.length} pago${pendientes.length === 1 ? "" : "s"} sin marcar`} icon="Clock" tone={pendientes.length ? "var(--warn)" : undefined} />
        <StatCard label="Ticket promedio" value={money(f.nPagos ? f.cobrado / f.nPagos : 0)} sub="Lo cobrado ÷ clientes que pagaron" icon="Ticket" />

            </p>

          </div>

          {falta && <div className="aviso aviso-bad" role="status"><Icon name="AlertTriangle" size={14} />Faltan {money(r.faltante)}: marcá otro cliente para cubrir el resto de los gastos.</div>}

              <th className="r">Fee</th>
              <th>Pago</th>
              <th>Cubre gastos</th>

            </tr>
          </thead>
          <tbody>
            {r.filas.length === 0 && <tr><td colSpan={COLS_PAGOS.length} className="text-center py-6" style={{ color: "var(--faint)" }}>No hay clientes para cobrar en {fmtMesLargo(mes)}.</td></tr>}
            {r.filas.map((fila) => {

              return (
                <React.Fragment key={c.id}>
                  <tr className={fila.huerfano ? "fuera" : ""}>

                    <td className="num r">{money(fila.base)}</td>

                          <button className="icon-btn" aria-label={`Deshacer pago de ${c.cliente}`} title="Deshacer pago" onClick={() => setConfirmId(pago.id)}><Icon name="Undo2" size={14} /></button>

                    <td>

                    </td>

                      {fila.descuentos ? (

                      ) : <span style={{ color: "var(--faint)" }}>—</span>}
                    </td>
                    <td className="num r font-bold" style={fila.aRepartir < -0.5 ? { color: "var(--bad)" } : undefined}>{money(fila.aRepartir)}</td>
                    {SOCIOS.map((s) => <td key={s.key} className="num r">{money(fila.parte[s.key])}</td>)}
                  </tr>
                  {abierto && (
                    <tr className="detalle-fila">
                      <td colSpan={COLS_PAGOS.length}>
                        <div className="detalle" id={`pago-${c.id}`}>
                          <div className="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs" style={{ color: "var(--muted)" }}>
                            {pago ? (
                              <>
                                <label className="flex items-center gap-2 font-bold">Monto cobrado
                                  <Celda className="num" style={{ width: 130, borderColor: "var(--line-soft)" }} type="number" min="0" step="10000" value={pago.monto} onChange={(e) => updPago(pago.id, "monto", e.target.value === "" ? "" : +e.target.value)} />
                                </label>
                                <label className="flex items-center gap-2 font-bold">Fecha de pago
                                  <input className="cell" style={{ width: 150, borderColor: "var(--line-soft)" }} type="date" value={pago.fecha || ""} onChange={(e) => updPago(pago.id, "fecha", e.target.value)} />
                                </label>
                              </>
                            ) : <span>Sin pagar todavía: se calcula con el fee.</span>}
                            <span>Servicio de {fmtMesLargo(fila.servicio)}</span>
                          </div>
                          <div>
                            <div className="eyebrow mb-1">Descuentos de este pago</div>
                            {fila.desc.length ? <ul className="desc-lista">{fila.desc.map((l, i) => <LineaDescuento key={i} l={l} />)}</ul> : <p className="text-xs" style={{ color: "var(--faint)" }}>Sin descuentos.</p>}
                            {esUltimo && falta && <p className="text-xs mt-1" style={{ color: "var(--bad)" }}>Faltan {money(r.faltante)} para cubrir los gastos: marcá otro cliente.</p>}
                            {fila.aRepartir < -0.5 && <p className="text-xs mt-1" style={{ color: "var(--bad)" }}>Los editores/CM de esta cuenta superan el pago.</p>}

                            {SOCIOS.map((s, i) => <span key={s.key}>{i ? " · " : ""}{s.name} <strong className="num" style={{ color: "var(--fg)" }}>{money(fila.parte[s.key])}</strong> ({fmtPct(f.pctMes[s.key])})</span>)}
                          </div>

                  )}

            })}
          </tbody>
          <tfoot>
            <tr>
              <td colSpan={2}><span className="eyebrow" style={{ color: "var(--fg)" }}>Total</span></td>
              <td className="num r">{money(r.total.base)}</td>
              <td colSpan={2}></td>
              <td className="num r" style={{ color: "var(--bad)" }}>− {money(r.total.descuentos)}</td>
              <td className="num r">{money(r.total.aRepartir)}</td>
